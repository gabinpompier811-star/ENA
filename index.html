<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail ENA - Gestion du Personnel & Formations</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #60a5fa; background-color: #1e293b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- En-tête -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">ENA - Gestion Militaire</h1>
        </div>
        <div class="flex items-center space-x-2 text-sm">
            <span id="connection-status" class="px-3 py-1 rounded-full bg-yellow-600 text-white font-medium">Connexion...</span>
        </div>
    </header>

    <!-- Navigation par onglets -->
    <nav class="bg-slate-800 border-b border-slate-700 flex px-4 space-x-2">
        <button onclick="switchTab('personnel')" id="btn-personnel" class="tab-btn active px-6 py-3 font-medium transition hover:bg-slate-700">Personnel</button>
        <button onclick="switchTab('formations')" id="btn-formations" class="tab-btn px-6 py-3 font-medium transition hover:bg-slate-700">Formations</button>
        <button onclick="switchTab('instructeurs')" id="btn-instructeurs" class="tab-btn px-6 py-3 font-medium transition hover:bg-slate-700">Instructeurs</button>
    </nav>

    <!-- Contenu Principal -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Onglet Personnel -->
        <section id="tab-personnel" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Gestion du Personnel</h2>
                <button onclick="openModal('personnel')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i> <span>Ajouter un agent</span>
                </button>
            </div>
            <div class="bg-slate-800 rounded-xl shadow border border-slate-700 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-700 text-slate-300 text-xs uppercase">
                        <tr>
                            <th class="p-4">Nom / Prénom</th>
                            <th class="p-4">Grade</th>
                            <th class="p-4">Spécialité</th>
                            <th class="p-4">Statut</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="personnel-list" class="divide-y divide-slate-700 text-sm">
                        <!-- Données chargées dynamiquement -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Onglet Formations -->
        <section id="tab-formations" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Suivi des Formations</h2>
                <button onclick="openModal('formation')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i> <span>Créer une formation</span>
                </button>
            </div>
            <div id="formations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cartes formations injectées ici -->
            </div>
        </section>

        <!-- Onglet Instructeurs -->
        <section id="tab-instructeurs" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Équipe d'Instruction</h2>
                <button onclick="openModal('instructeur')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i> <span>Ajouter un instructeur</span>
                </button>
            </div>
            <div class="bg-slate-800 rounded-xl shadow border border-slate-700 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-700 text-slate-300 text-xs uppercase">
                        <tr>
                            <th class="p-4">Instructeur</th>
                            <th class="p-4">Domaine</th>
                            <th class="p-4">Contact</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="instructors-list" class="divide-y divide-slate-700 text-sm">
                        <!-- Données instructeurs injectées ici -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modale d'ajout générique -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold">Ajouter</h3>
            <form id="generic-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div id="modal-fields" class="space-y-3">
                    <!-- Champs injectés dynamiquement -->
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-medium transition">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Firebase & Logique de Synchronisation -->
    <script>
        // Configuration Firebase (Reliée à votre base de données Realtime Database)
        const firebaseConfig = {
            databaseURL: "https://forces-speciales-francaises-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Indicateur de connexion en temps réel
        const statusEl = document.getElementById('connection-status');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                statusEl.textContent = "Connecté (Synchro active)";
                statusEl.className = "px-3 py-1 rounded-full bg-emerald-600 text-white font-medium";
            } else {
                statusEl.textContent = "Hors ligne / Connexion...";
                statusEl.className = "px-3 py-1 rounded-full bg-amber-600 text-white font-medium";
            }
        });

        let currentModalType = '';

        // Navigation entre onglets
        function switchTab(tabName) {
            ['personnel', 'formations', 'instructeurs'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('active');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        // Gestion des modales
        function openModal(type) {
            currentModalType = type;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const fields = document.getElementById('modal-fields');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (type === 'personnel') {
                title.textContent = "Ajouter un agent";
                fields.innerHTML = `
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Nom et Prénom</label><input type="text" id="f-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Grade</label><input type="text" id="f-grade" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Spécialité</label><input type="text" id="f-spec" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Statut</label><select id="f-status" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"><option value="Actif">Actif</option><option value="En formation">En formation</option><option value="Permis / Repos">Permis / Repos</option></select></div>
                `;
            } else if (type === 'formation') {
                title.textContent = "Créer une formation";
                fields.innerHTML = `
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Nom de la formation</label><input type="text" id="f-title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Description / Objectifs</label><textarea id="f-desc" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></textarea></div>
                `;
            } else if (type === 'instructeur') {
                title.textContent = "Ajouter un instructeur";
                fields.innerHTML = `
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Nom de l'instructeur</label><input type="text" id="f-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Domaine d'expertise</label><input type="text" id="f-domain" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-400 mb-1">Contact / Indicatif</label><input type="text" id="f-contact" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
                `;
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('generic-form').reset();
        }

        // Soumission des formulaires et écriture dans Firebase
        function handleFormSubmit(e) {
            e.preventDefault();
            if (currentModalType === 'personnel') {
                const data = {
                    name: document.getElementById('f-name').value,
                    grade: document.getElementById('f-grade').value,
                    spec: document.getElementById('f-spec').value,
                    status: document.getElementById('f-status').value
                };
                db.ref('personnel').push(data);
            } else if (currentModalType === 'formation') {
                const data = {
                    title: document.getElementById('f-title').value,
                    desc: document.getElementById('f-desc').value
                };
                db.ref('formations').push(data);
            } else if (currentModalType === 'instructeur') {
                const data = {
                    name: document.getElementById('f-name').value,
                    domain: document.getElementById('f-domain').value,
                    contact: document.getElementById('f-contact').value
                };
                db.ref('instructeurs').push(data);
            }
            closeModal();
        }

        // Suppression dans Firebase
        function deleteItem(path, id) {
            db.ref(`${path}/${id}`).remove();
        }

        // Écouteurs en temps réel (Synchronisation instantanée sur tous les écrans)
        db.ref('personnel').on('value', (snapshot) => {
            const list = document.getElementById('personnel-list');
            list.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                list.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Aucun agent enregistré.</td></tr>`;
                return;
            }
            Object.entries(data).forEach(([id, item]) => {
                list.innerHTML += `
                    <tr class="hover:bg-slate-750 transition">
                        <td class="p-4 font-medium">${item.name}</td>
                        <td class="p-4">${item.grade}</td>
                        <td class="p-4">${item.spec}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-900/50 text-blue-300 border border-blue-700/50">${item.status}</span></td>
                        <td class="p-4 text-right"><button onclick="deleteItem('personnel', '${id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        });

        db.ref('formations').on('value', (snapshot) => {
            const grid = document.getElementById('formations-grid');
            grid.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                grid.innerHTML = `<div class="text-slate-500 col-span-full text-center p-8">Aucune formation active.</div>`;
                return;
            }
            Object.entries(data).forEach(([id, item]) => {
                grid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow flex flex-col justify-between space-y-4">
                        <div>
                            <h3 class="text-lg font-bold text-blue-400">${item.title}</h3>
                            <p class="text-sm text-slate-300 mt-2">${item.desc}</p>
                        </div>
                        <div class="flex justify-end pt-2 border-t border-slate-700">
                            <button onclick="deleteItem('formations', '${id}')" class="text-red-400 hover:text-red-300 text-sm flex items-center space-x-1"><i class="fa-solid fa-trash"></i> <span>Supprimer</span></button>
                        </div>
                    </div>
                `;
            });
        });

        db.ref('instructeurs').on('value', (snapshot) => {
            const list = document.getElementById('instructors-list');
            list.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                list.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Aucun instructeur enregistré.</td></tr>`;
                return;
            }
            Object.entries(data).forEach(([id, item]) => {
                list.innerHTML += `
                    <tr class="hover:bg-slate-750 transition">
                        <td class="p-4 font-medium">${item.name}</td>
                        <td class="p-4">${item.domain}</td>
                        <td class="p-4 text-slate-400">${item.contact}</td>
                        <td class="p-4 text-right"><button onclick="deleteItem('instructeurs', '${id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
